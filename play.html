<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ball Game NEXT · 최신 개발 버전</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#11151c;color:#e2e8f0;font:14px system-ui;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:24px}#status[hidden]{display:none}button{padding:10px;background:#1e293b;border:1px solid #64748b;border-radius:8px;color:inherit}
</style>
</head>
<body>
<div id="status" role="status"><span id="message">최신 개발 버전을 확인하는 중…</span><button id="retry" hidden>다시 시도</button></div>
<script type="module">
const repository='qwerzaq56-sketch/ball-game-next',branch='codex/cloud-next-m4';
const retry=document.getElementById('retry');retry.addEventListener('click',()=>location.reload());
try{
 const response=await fetch(`https://api.github.com/repos/${repository}/commits/${encodeURIComponent(branch)}?refresh=${Date.now()}`,{cache:'no-store',headers:{Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
 if(!response.ok)throw Error(`최신 버전 확인 실패 (${response.status})`);
 const {sha}=await response.json();if(!/^[a-f0-9]{40}$/.test(sha))throw Error('버전 정보를 확인할 수 없습니다.');
 const frame=document.createElement('iframe');frame.title='Ball Game NEXT';frame.allow='autoplay; fullscreen';frame.src=`https://raw.githack.com/${repository}/${sha}/index.html`;
 frame.addEventListener('load',()=>{document.getElementById('status').hidden=true;frame.contentWindow?.focus();});
 document.body.append(frame);
}catch(error){document.getElementById('message').textContent=`${error.message} · 잠시 후 다시 시도해 주세요.`;retry.hidden=false;}
</script>
</body>
</html>
