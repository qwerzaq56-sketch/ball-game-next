<!doctype html><meta charset="utf-8"><title>숲 반복 타일 · 하이라이트 보정</title><style>body{background:#132329;color:#ddd;font:14px sans-serif;margin:16px}canvas{width:100%;max-width:900px}</style><h1>숲 005 · 반복 경계 / 하이라이트 보정</h1><p id="status">로딩 중</p><canvas width="1600" height="1600"></canvas><script type="module">
