<!doctype html><html lang="ko"><meta charset="utf-8"><title>AI 피난처·회복 이동 검수</title><style>body{background:#14232c;color:#eee;font:14px system-ui;margin:16px}button{padding:10px;margin:5px}canvas{width:100%;max-width:1100px}pre{white-space:pre-wrap}</style><h1>실제 AI 판단 → 환경 오브젝트 이동</h1><p>통제 장면에서 실제 updateAI·BiomeObjects·Biomes를 호출합니다. 자연 플레이나 피격률 측정이 아닙니다.</p><button id="oasis">저체력 → 오아시스</button><button id="snow">눈보라 → 서리 피난처</button><button id="step">1초 진행</button><canvas width="1100" height="650"></canvas><pre id="state">로딩</pre><script type="module">
import {dist} from '../js/collision.js';import {Game} from '../js/game.js';import {AIEntity,updateAI,decideAI} from '../js/ai.js?ai-refuge-01';import {loadLandmarkImages} from '../js/landmarkArt.js';import {loadEnvironmentImages} from '../js/environmentArt.js';import {loadCharacterRaster} from '../js/characterRasterArt.js';
await Promise.all([loadLandmarkImages(),loadEnvironmentImages(),loadCharacterRaster()]);const balance=await(await fetch('../config/gameBalance.json')).json();const canvas=document.querySelector('canvas'),status=document.querySelector('#state');let g,ai,obj,kind,elapsed=0,working=false;
async function setup(next){if(working)return;working=true;kind=next;elapsed=0;status.textContent='로딩';g=new Game(structuredClone(balance),canvas,{keys:new Set(),mouseDown:false,mouseX:0,mouseY:0,consumeDodge:()=>false},{showUnlock(){},showDefeatMessage(){},preferences:{names:false}},{seed:44});g.gameTime=20;g.biomeObjects.sync();obj=g.biomeObjects.objects.find(o=>o.candidate===(kind==='oasis'?'desert-oasis':'snow-shelter')&&!g.biomes.danger({x:o.x,y:o.y,size:100,color:'red',_world:g.balance.world}));if(!obj){status.textContent='오브젝트 없음';working=false;return}g.biomeObjects.objects=[obj];if(kind==='snow')g.biomes.blizzard=()=>true;ai=new AIEntity({x:obj.x+obj.config.radius+100,y:obj.y,color:'red',colorHex:'#ef4444',balance:g.balance,startSize:100});ai.hp=kind==='oasis'?ai.maxHp*.2:ai.maxHp;g.player.x=obj.x-1000;g.player.y=obj.y;g.entities=[ai];g.orbs=[];g.camera={x:obj.x+obj.config.radius/2,y:obj.y,zoom:1};g.buildGrid();await g.biomes.terrainArt.loading;working=false;decideAI(ai,g,g.balance);draw()}
function draw(){g.render();status.textContent=JSON.stringify({kind,elapsed,distance:dist(ai,obj),objectDanger:g.biomes.danger({...ai,x:obj.x,y:obj.y})?.kind,fields:g.abilities.fields.length,biomesEnabled:g.biomes.enabled,recovering:ai.recovering,objects:g.biomeObjects.objects.map(o=>o.candidate),region:g.biomes.regionAt(ai)?.id,sensing:g.biomes.sensingRange(ai),state:ai.state,target:ai.target?.candidate,hp:ai.hp,maxHp:ai.maxHp,frostExposure:ai.frostExposure??0,frostbite:ai.frostbiteRemaining??0,sheltered:g.biomeObjects.inFrostShelter(ai),radius:obj.config.radius,visualScale:obj.visualScale,x:ai.x,y:ai.y},null,2)}
document.querySelector('#oasis').onclick=()=>setup('oasis');document.querySelector('#snow').onclick=()=>setup('snow');document.querySelector('#step').onclick=()=>{if(working||!g)return;for(let i=0;i<60;i++){g.gameTime+=1/60;g.buildGrid();updateAI(ai,1/60,g,g.balance);g.biomeObjects.update(1/60);g.biomes.update(1/60)}elapsed++;draw()};await setup('oasis');
</script></html>
