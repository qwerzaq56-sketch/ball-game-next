<!doctype html><meta charset="utf-8"><title>13종 실제 오브젝트 렌더</title>
<style>body{background:#14232c;color:#eee;font:15px system-ui;margin:12px}canvas{width:100%;max-width:1100px}button{padding:8px}</style>
<h1>현재 리소스 13종 · 실제 BiomeObjects.draw</h1><p>준비 상태 / 분출 활성 상태. 범위·방향은 기존 판정 기준.</p><button>준비 / 수혜 후 전환</button><canvas width="1100" height="880"></canvas>
<script type="module">
import {BiomeObjects} from '../js/biomeObjects.js?art-parallel-02';import {DEFAULT_OBJECT_IDS,BIOME_OBJECTS} from '../js/biomeObjectCatalog.js?art-parallel-02';import {loadLandmarkImages} from '../js/landmarkArt.js?art-parallel-02';
await loadLandmarkImages();
import {loadEnvironmentImages} from '../js/environmentArt.js?art-parallel-02';await loadEnvironmentImages();const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let ready=true;
const game={canvas,biomes:{enabled:true},camera:{x:550,y:440},gameTime:2};const objects=new BiomeObjects(game);objects.sync=()=>{};
for(const [i,candidate]of DEFAULT_OBJECT_IDS.entries()){
const x=135+(i%4)*275,y=130+Math.floor(i/4)*220;
objects.objects.push({id:candidate,candidate,x,y,config:{...BIOME_OBJECTS[candidate],radius:candidate==='lake-vortex'?75:BIOME_OBJECTS[candidate].radius},phase:0,width:90,points:[{x:x-100,y},{x:x+100,y}],_world:{worldWidth:10000,worldHeight:10000}});
}
function draw(){ctx.fillStyle='#253d49';ctx.fillRect(0,0,1100,880);for(const o of objects.objects)objects.cooldowns.set(o.id,ready?0:99);game.gameTime=ready?2:8;objects.draw(ctx,1);}
document.querySelector('button').onclick=()=>{ready=!ready;draw()};draw();
</script>
