<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ball Game NEXT · 시뮬레이션 룸</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:14px system-ui}header{padding:10px 16px;border-bottom:1px solid #334155;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#7dd3fc}main{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 64px)}aside{overflow:auto;padding:14px;background:#111827}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}input,select,button,textarea{font:inherit;color:inherit;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:7px}input,select{max-width:160px}button{cursor:pointer;margin:3px}section#view{min-width:0;display:flex;flex-direction:column}#room{width:100%;height:58%;min-height:180px;touch-action:none;background:#11151c}#graph{width:100%;height:150px;background:#0f172a}#stats,#comparison,#status{padding:8px;margin:0;white-space:pre-wrap}#status{color:#fcd34d}details{padding:6px;border-top:1px solid #334155}summary{cursor:pointer}#skill-tuning input{width:85px}.hud-btn{padding:7px}dialog::backdrop{background:#0009}@media(max-width:750px){main{grid-template-columns:1fr;height:auto}aside{max-height:38dvh}#room{height:52dvh}#graph{height:150px}}
</style></head><body><header><strong>시뮬레이션 룸 · 계측 대상만 소환</strong><a href="index.html">게임</a><button id="review">의견 남기기</button><button id="answers">의견 JSON</button></header><main><aside><p>같은 초기 조건으로 비교합니다. 변경은 방 재설정부터 적용되며 일반 플레이 설정에는 저장되지 않습니다.</p><div id="settings"></div><label>실험 행동<select id="operation"><option value="attack">충전 공격 1회</option><option value="E">E 1회</option><option value="R">R 1회</option><option value="absorb">흡수 유지</option><option value="manual">직접 조작</option></select></label><label>공격 충전<input id="charge" type="number" value="0.75" min="0" max="1" step="0.05"></label><div><button id="reset">방 재설정</button><button id="play">실행/정지</button><button id="step">1프레임</button><button id="food">먹이 5개 소환</button></div><hr><label>비교할 수치<select id="parameter"></select></label><label>값<input id="value" type="number" step="0.05"></label><button id="baseline">현재 수치를 A로 고정</button><label>비교 시간(초)<input id="duration" type="number" value="10" min="1" max="60" step="1"></label><button id="compare">동일 행동 A/B 비교</button><button id="export">계측 JSON</button><div id="skills"></div></aside><section id="view"><canvas id="room"></canvas><p id="status" role="status"></p><p id="stats"></p><label style="padding:0 8px;justify-content:flex-start">보기 확대<input id="zoom" type="range" min="1" max="4" value="1" step="0.1"></label><canvas id="graph"></canvas><p id="comparison"></p><p style="padding:8px">WASD 이동 · 좌클릭 누르기→떼기 공격 · 우클릭 흡수 · Space 회피/달리기 · E/R · 터치 드래그 조준 후 발사</p></section></main><script type="module" src="js/simulationRoomUI.js"></script></body></html>
